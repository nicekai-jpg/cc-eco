[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-eco"
version = "3.0.0"
description = "Claude Code ecosystem switcher"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"

[project.scripts]
cc-eco = "cc_eco.cli:main"

[tool.setuptools.packages.find]
include = ["cc_eco*"]
